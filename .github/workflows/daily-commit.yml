name: Daily Commit

on:
  schedule:
    # Runs every day at 00:00 UTC (midnight) = 5:00 AM Pakistan
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Setup Git
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
      
      - name: Update timestamp
        run: |
          # Create simple timestamp
          echo "Bot update: $(date)" > timestamp.txt
      
      - name: Simple README update
        run: |
          # Just update the date line in README
          current_date=$(date +"%Y-%m-%d %H:%M UTC")
          sed -i "s|🕒 Last Updated: \*\*.*\*\*|🕒 Last Updated: **$current_date**|" README.md
      
      - name: Commit changes
        run: |
          git add timestamp.txt README.md
          git commit -m "🤖 Daily auto-commit [$(date +'%Y-%m-%d')]" || echo "No changes"
          git push
