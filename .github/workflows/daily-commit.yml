name: Daily Commit

on:
  schedule:
    - cron: '0 0 * * *'  # Midnight UTC = 5:00 AM Pakistan
  workflow_dispatch:

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Git
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
      
      - name: Update timestamp
        run: |
          echo "Last bot update: $(date)" > timestamp.txt
      
      - name: Get GitHub Stats
        id: stats
        run: |
          # Get stats with retry
          sleep 1
          response=$(curl -s "https://api.github.com/users/Luser408")
          echo "API Response length: ${#response}"
          
          # Extract data safely
          followers=$(echo "$response" | grep -o '"followers":[0-9]*' | head -1 | cut -d: -f2 || echo "0")
          public_repos=$(echo "$response" | grep -o '"public_repos":[0-9]*' | head -1 | cut -d: -f2 || echo "0")
          
          echo "followers=$followers" >> $GITHUB_OUTPUT
          echo "public_repos=$public_repos" >> $GITHUB_OUTPUT
          
          echo "Followers: $followers"
          echo "Public Repos: $public_repos"
      
      - name: Update README
        run: |
          current_date=$(date +"%Y-%m-%d %H:%M UTC")
          followers="${{ steps.stats.outputs.followers }}"
          public_repos="${{ steps.stats.outputs.public_repos }}"
          
          echo "Updating README with:"
          echo "Date: $current_date"
          echo "Followers: $followers"
          echo "Public Repos: $public_repos"
          
          # Create the new stats content
          new_content="<!--STATS_START-->
🕒 Last Updated: **$current_date**

👥 Followers: **$followers**

📦 Public Repos: **$public_repos**

✨ Recently Starred Repositories:
⭐ [Luser408/Luser408](https://github.com/Luser408/Luser408)
⭐ [shahradelahi/zod-request](https://github.com/shahradelahi/zod-request)
⭐ [shahradelahi/sha256](https://github.com/shahradelahi/sha256)
<!--STATS_END-->"
          
          # Use Python for reliable text replacement
          python3 -c "
import re
with open('README.md', 'r') as f:
    content = f.read()

# Replace everything between the markers
pattern = r'<!--STATS_START-->.*?<!--STATS_END-->'
new_content = '''$new_content'''

import os
new_content = os.path.expandvars(new_content)
updated = re.sub(pattern, new_content, content, flags=re.DOTALL)

with open('README.md', 'w') as f:
    f.write(updated)
print('README updated successfully!')
"
      
      - name: Commit changes
        run: |
          git add timestamp.txt README.md
          git commit -m "📊 Daily stats update [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
          git push
