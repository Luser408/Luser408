name: Daily Commit

on:
  schedule:
    # Runs at 00:00 UTC every day (midnight)
    - cron: '0 0 * * *'
  workflow_dispatch:  # Allows you to run manually

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # This allows the bot to commit
    
    steps:
      # Step 1: Get the code
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # Step 2: Setup git user
      - name: Setup Git
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
      
      # Step 3: Make a simple change
      - name: Make a change
        run: |
          # Create or update a timestamp file
          date > timestamp.txt
          echo "Last updated: $(date)" >> timestamp.txt
      
      # Step 4: Commit and push
      - name: Commit and push
        run: |
          git add timestamp.txt
          git commit -m "chore: daily update [$(date +'%Y-%m-%d')]" || echo "No changes to commit"
          git push
