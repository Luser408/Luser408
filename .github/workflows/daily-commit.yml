name: Daily Commit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Update files
        run: |
          # Update timestamp
          date > timestamp.txt
          
          # Update date in README (simple sed)
          current_date=$(date +"%Y-%m-%d %H:%M UTC")
          sed -i "s|Last Updated: \*\*.*\*\*|Last Updated: **$current_date**|" README.md
      
      - name: Commit
        run: |
          git config user.name "GitHub Bot"
          git config user.email "bot@github.com"
          git add .
          git commit -m "📅 Daily update" || exit 0
          git push
