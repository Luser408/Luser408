name: Daily Commit

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Git
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
      
      - name: Update timestamp
        run: echo "Last update: $(date)" > timestamp.txt
      
      - name: Update README
        run: |
          # Get current date
          current_date=$(date +"%Y-%m-%d %H:%M UTC")
          
          # Create new stats content
          cat > new_stats.txt << 'EOF'
<!--STATS_START-->
🕒 Last Updated: **DATE_PLACEHOLDER**

👥 Followers: **39**

📦 Public Repos: **28**

✨ Recently Starred Repositories:
⭐ [Luser408/Luser408](https://github.com/Luser408/Luser408)
⭐ [shahradelahi/zod-request](https://github.com/shahradelahi/zod-request)
⭐ [shahradelahi/sha256](https://github.com/shahradelahi/sha256)
<!--STATS_END-->
EOF
          
          # Replace placeholder with actual date
          sed -i "s/DATE_PLACEHOLDER/$current_date/g" new_stats.txt
          
          # Replace the section in README
          awk '
            /<!--STATS_START-->/ { printing=1; system("cat new_stats.txt"); next }
            /<!--STATS_END-->/ { printing=0; next }
            !printing { print }
          ' README.md > README_temp.md && mv README_temp.md README.md
          
          # Clean up
          rm -f new_stats.txt
      
      - name: Commit changes
        run: |
          git add timestamp.txt README.md
          git commit -m "🤖 Daily update [$(date +'%Y-%m-%d')]" || echo "No changes"
          git push
