name: Test Bot

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        
      - name: Test date
        run: echo "Test: $(date)" > test.txt
        
      - name: View README
        run: cat README.md | grep -A2 -B2 "Last Updated"
        
      - name: Simple commit
        run: |
          git config user.name "Test Bot"
          git config user.email "test@github.com"
          git add test.txt
          git commit -m "Test: $(date)" || echo "No changes"
          git push
